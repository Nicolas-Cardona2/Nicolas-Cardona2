name: Generar snake

on:
  schedule:
    - cron: "0 0 * * *"   # todos los días a medianoche UTC
  workflow_dispatch:       # permite ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#b79cf0&color_dots=#161b22,#3b2a6b,#5b3fa8,#8b66d9,#c4a8ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
