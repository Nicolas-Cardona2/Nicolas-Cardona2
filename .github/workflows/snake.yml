name: Generar snake

on:
  schedule:
    - cron: "0 0 * * *"   # todos los días a medianoche UTC
  workflow_dispatch:       # permite ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff2a2a&color_dots=#1a0a0a,#4d0a0a,#8c0000,#a50f1a,#c1121f&color_dot_border=#0a0a0a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2a2a&color_dots=#1a0a0a,#4d0a0a,#8c0000,#a50f1a,#c1121f&color_dot_border=#0a0a0a

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
